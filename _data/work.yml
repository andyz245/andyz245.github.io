- name: Locus
  kind: Artificial Scientist for AI R&amp;D
  period: 2025 —
  body: >-
    A long-horizon research system that runs its own experiments for days at a
    time. Locus is the first AI system to beat human experts on RE-Bench given
    the same time and compute, and in January 2026 it set a world record on the
    human NanoGPT Speedrun leaderboard with a fused Triton kernel it designed,
    implemented, and debugged itself.
  stats:
    - 1.30 vs 1.27 human expert on RE-Bench
    - SOTA on KernelBench and MLE-Bench Lite
    - 64-hour autonomous runs
  links:
    - label: Results
      url: https://www.intology.ai/blog/previewing-locus
    - label: Speedrun record
      url: https://github.com/KellerJordan/modded-nanogpt/pull/199

- name: Zochi
  kind: The first Artificial Scientist
  period: 2025
  body: >-
    Zochi takes a research question from literature review through
    experimentation to a written paper. Its paper Tempest was accepted to the
    main proceedings of ACL 2025 — the first fully AI-generated discovery to
    clear peer review at an A*-ranked venue, scoring in the top 8.2% of
    submissions by meta-review score.
  stats:
    - ACL 2025 main proceedings
    - Top 8.2% of submissions
    - Peer-reviewed papers at multiple ICLR 2025 workshops
  links:
    - label: Announcement
      url: https://www.intology.ai/blog/zochi-acl
    - label: Technical report
      url: https://www.intology.ai/blog/zochi-tech-report
    - label: Code
      url: https://github.com/IntologyAI/Zochi

- name: NanoGPT-Bench
  kind: Measuring real research ability
  period: 2026
  body: >-
    Benchmarks for research agents are easy to saturate and easy to
    contaminate. NanoGPT-Bench drops agents into the GPT-2 pretraining speedrun
    at a fixed human world record and asks them to make it faster, with no
    internet and no human help. Frontier coding agents recover less than 10% of
    what the human community achieved over the following five months, spending
    most of their compute on hyperparameter tuning instead of the algorithmic
    work that actually moves the record.
  stats:
    - 9.3% of human progress recovered, at best
    - 512 H100-hours per agent
  links:
    - label: Write-up
      url: https://www.intology.ai/blog/nanogpt-bench
    - label: Code
      url: https://github.com/IntologyAI/NanoGPT-Bench
