<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.name }} — {{ site.role }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.name }}">
  <link rel="canonical" href="{{ site.url }}/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.name }} — {{ site.role }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ site.name }} — {{ site.role }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:creator" content="@zhouandy_">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ site.name }}",
      "url": "{{ site.url }}/",
      "jobTitle": "{{ site.role }}",
      "description": "{{ site.description }}",
      "worksFor": { "@type": "Organization", "name": "Intology", "url": "https://www.intology.ai" }
    }
  </script>

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="bar-inner">
      <a class="bar-name" href="/">{{ site.name }}</a>
      <nav class="bar-nav">
        <a href="#program">Program</a>
        <a href="#research">Publications</a>
        <a href="#updates">Writing</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <p class="foot-name">{{ site.name }}</p>
      <ul class="foot-links">
        {% for link in site.links %}
        <li><a href="{{ link.url }}">{{ link.label }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </footer>

  <script src="/assets/js/site.js" defer></script>
</body>

</html>
