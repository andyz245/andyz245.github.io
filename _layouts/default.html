<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.name }} — {{ site.role }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.name }}">
  <link rel="canonical" href="{{ site.url }}/">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.name }} — {{ site.role }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}{{ site.avatar }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@zhouandy_">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="{{ site.avatar }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">

  <script>
    // Dark by default; resolved before first paint so the page never flashes.
    document.documentElement.dataset.theme =
      localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ site.name }}",
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}{{ site.avatar }}",
      "jobTitle": "{{ site.role }}",
      "description": "{{ site.description }}",
      "worksFor": { "@type": "Organization", "name": "Intology", "url": "https://www.intology.ai" }
    }
  </script>

  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="bar-inner">
      <a class="bar-name" href="/">{{ site.name }}</a>
      <nav class="bar-nav">
        <a href="#work">Work</a>
        <a href="#research">Research</a>
        <a href="#updates">Updates</a>
      </nav>
      <button class="theme" type="button" aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" />
        </svg>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.4A8.6 8.6 0 1 1 9.6 4a7 7 0 0 0 10.4 10.4z" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <p class="foot-name">{{ site.name }}</p>
      <ul class="foot-links">
        {% for link in site.links %}
        <li><a href="{{ link.url }}">{{ link.label }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </footer>

  <script src="/assets/js/site.js" defer></script>
</body>

</html>
